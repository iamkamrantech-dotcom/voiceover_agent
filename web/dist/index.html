    <script>
      // Set the theme before first paint so the page never flashes the
      // wrong one on load.
      (function () {
        try {
          var saved = localStorage.getItem('va-theme')
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved)
          }
        } catch (e) {}
      })()
    </script>
