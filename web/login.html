<!doctype html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voiceover Agent &mdash; Login</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="wrap" style="max-width:420px;padding-top:60px">
  <div class="card">
    <h2>Password darkar hai</h2>
    <p class="hint">Ye app sirf aap ke liye hai.</p>
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password">
    <div class="actions">
      <button class="primary" id="go">Andar jayein</button>
      <span id="msg" class="muted small"></span>
    </div>
  </div>
</main>
<script>
const send = async () => {
  const form = new FormData();
  form.append("password", document.getElementById("pw").value);
  const res = await fetch("/api/login", { method: "POST", body: form });
  if (res.ok) location.href = "/";
  else document.getElementById("msg").textContent = "Password ghalat hai.";
};
document.getElementById("go").addEventListener("click", send);
document.getElementById("pw").addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});
</script>
</body>
</html>
